name: Materialize and verify Reforge

on:
  push:
    paths:
      - 'source-parts/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize verified source when transport parts exist
        shell: bash
        run: |
          if [ -f unpack.mjs ] && [ -d source-parts ]; then
            node unpack.mjs
            rm -rf source-parts unpack.mjs reforge-source.tgz.b64 reforge-source.part01
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Materialize Reforge application source"
              git push origin HEAD:main
            fi
          else
            echo "Readable source is already materialized."
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ztfbcefdqqklpvijxyen.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G0IZvz5e6cpgRupw4jGJ_g_FqXDzJms
        run: npm run build
