name: Verify Reforge

on:
  push:
    paths:
      - 'source-parts/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize verified source when transport parts exist
        shell: bash
        run: |
          if [ -f unpack.mjs ] && [ -d source-parts ]; then
            node unpack.mjs
            rm -rf source-parts unpack.mjs reforge-source.tgz.b64 reforge-source.part01
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Materialize Reforge application source"
              git push origin HEAD:main
            fi
          fi
      - name: Run install, checks, tests and production build
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ztfbcefdqqklpvijxyen.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G0IZvz5e6cpgRupw4jGJ_g_FqXDzJms
        run: |
          set +e
          mkdir -p .ci
          : > .ci/details.log

          run_check () {
            name="$1"; shift
            echo "===== $name =====" >> .ci/details.log
            "$@" >> .ci/details.log 2>&1
            code=$?
            echo "$name=$code" >> .ci/status.env
            echo "exit=$code" >> .ci/details.log
            return 0
          }

          : > .ci/status.env
          run_check install npm install --no-audit --no-fund
          if grep -q '^install=0$' .ci/status.env; then
            run_check typecheck npm run typecheck
            run_check lint npm run lint
            run_check unit_tests npm test
            run_check production_build npm run build
          else
            echo "typecheck=125" >> .ci/status.env
            echo "lint=125" >> .ci/status.env
            echo "unit_tests=125" >> .ci/status.env
            echo "production_build=125" >> .ci/status.env
          fi

          tail -n 160 .ci/details.log > .ci/details.tail.log
          mv .ci/details.tail.log .ci/details.log
          {
            echo "# Reforge CI verification"
            echo
            echo "Commit tested: $(git rev-parse HEAD)"
            echo
            while IFS='=' read -r name code; do
              if [ "$code" = "0" ]; then mark="PASS"; elif [ "$code" = "125" ]; then mark="SKIPPED"; else mark="FAIL ($code)"; fi
              echo "- $name: $mark"
            done < .ci/status.env
          } > .ci/verification.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/verification.md .ci/details.log package-lock.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Reforge CI verification"
            git push origin HEAD:main
          fi

          failures=$(grep -vE '=(0|125)$' .ci/status.env | wc -l | tr -d ' ')
          skipped=$(grep '=125$' .ci/status.env | wc -l | tr -d ' ')
          if [ "$failures" != "0" ] || [ "$skipped" != "0" ]; then
            exit 1
          fi
