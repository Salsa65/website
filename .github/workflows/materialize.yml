name: Materialize and verify Reforge
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('source-parts/*.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize source tree
        run: |
          node unpack.mjs
          rm -rf source-parts unpack.mjs reforge-source.tgz.b64 reforge-source.tgz.chunk*
      - name: Commit readable source
        run: |
          git config user.name "Reforge CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize readable Reforge production source"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ztfbcefdqqklpvijxyen.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G0IZvz5e6cpgRupw4jGJ_g_FqXDzJms
        run: npm run build
