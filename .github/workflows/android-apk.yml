name: Build Hazel Novel Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [hazel-vercel]
    paths:
      - 'public/**'
      - 'capacitor.config.ts'
      - 'scripts/build-mobile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Hazel mobile web bundle
        run: npm run build:mobile

      - name: Create Android platform
        run: npx cap add android

      - name: Enable microphone permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          insert = "\n".join(x for x in perms if x not in text)
          if insert:
              text = text.replace("<application", insert + "\n    <application", 1)
              p.write_text(text)
          PY

      - name: Sync web bundle
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hazel-Novel-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hazel-Novel-Studio-Android-APK
          path: Hazel-Novel-Studio.apk
          retention-days: 30
