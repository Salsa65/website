name: Build Reforge Duo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/duo/**'
      - 'components/DuoForgeApp.tsx'
      - 'components/DuoForgeApp.module.css'
      - 'capacitor.config.ts'
      - 'scripts/build-mobile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build native web bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ztfbcefdqqklpvijxyen.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G0IZvz5e6cpgRupw4jGJ_g_FqXDzJms
        run: npm run build:mobile

      - name: Create Android platform
        run: npx cap add android

      - name: Sync web bundle
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Reforge-Duo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reforge-Duo-Android-APK
          path: Reforge-Duo-debug.apk
          retention-days: 30
