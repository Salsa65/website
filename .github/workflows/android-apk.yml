name: Build Aetherfall Android APK
on:
  workflow_dispatch:
  push:
    branches: [aetherfall-rebuild]
    paths: ['app/**','components/**','lib/**','public/**','capacitor.config.ts','scripts/build-mobile.mjs','package.json','package-lock.json','.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare web bundle
        run: npm run build:mobile
      - name: Create Android platform
        run: npx cap add android
      - name: Enable Android permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml');t=p.read_text()
          perms=['<uses-permission android:name="android.permission.INTERNET" />','<uses-permission android:name="android.permission.RECORD_AUDIO" />','<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />']
          add='\n'.join(x for x in perms if x not in t)
          if add:p.write_text(t.replace('<application',add+'\n    <application',1))
          PY
      - name: Apply Aetherfall launcher icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y imagemagick
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec; dir="android/app/src/main/res/$1"; size="$2"; mkdir -p "$dir"
            convert public/aetherfall-icon.jpg -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Re-apply launcher icon after sync
        run: |
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec; dir="android/app/src/main/res/$1"; size="$2"; mkdir -p "$dir"
            convert public/aetherfall-icon.jpg -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
      - name: Harden Android WebView and app identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          t=t.replace('<application', '<application android:usesCleartextTraffic="false"', 1) if 'usesCleartextTraffic=' not in t else t
          p.write_text(t)
          PY
      - name: Build APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aetherfall.apk
      - uses: actions/upload-artifact@v4
        with: {name: Aetherfall-Android-APK, path: Aetherfall.apk, retention-days: 30}
