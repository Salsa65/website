name: Build Aetherfall Android APK

on:
  workflow_dispatch:
  push:
    branches: [hazel-vercel]
    paths:
      - 'public/**'
      - 'capacitor.config.ts'
      - 'scripts/build-mobile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Aetherfall mobile web bundle
        run: npm run build:mobile

      - name: Create Android platform
        run: npx cap add android

      - name: Apply Aetherfall light-dark launcher icon
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode("""""")
          densities = {
              "mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192,
          }
          from PIL import Image
          import io
          src = Image.open(io.BytesIO(data)).convert("RGB")
          for folder, size in densities.items():
              out = Path("android/app/src/main/res") / folder
              out.mkdir(parents=True, exist_ok=True)
              img = src.resize((size,size), Image.Resampling.LANCZOS)
              img.save(out/"ic_launcher.png")
              img.save(out/"ic_launcher_round.png")
          PY

      - name: Enable microphone permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          insert = "\n".join(x for x in perms if x not in text)
          if insert:
              text = text.replace("<application", insert + "\n    <application", 1)
              p.write_text(text)
          PY

      - name: Apply Aetherfall launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="android/app/src/main/res/$1"
            size="$2"
            mkdir -p "$dir"
            convert public/aetherfall-icon.jpg -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done

      - name: Sync web bundle
        run: npx cap sync android

      - name: Apply Aetherfall launcher icon
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open("public/aetherfall-icon.png").convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for folder,size in sizes.items():
              out=base/folder
              out.mkdir(parents=True,exist_ok=True)
              img=src.resize((size,size),Image.Resampling.LANCZOS)
              img.save(out/"ic_launcher.png")
              img.save(out/"ic_launcher_round.png")
          PY

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aetherfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-Android-APK
          path: Aetherfall.apk
          retention-days: 30
